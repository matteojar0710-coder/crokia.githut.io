<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Crok IA</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700&family=DM+Sans:wght@300;400;500&display=swap"
    rel="stylesheet">

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
    import {
      getFirestore, doc, setDoc, getDoc, collection,
      onSnapshot, orderBy, query, addDoc, serverTimestamp,
      getDocs, where
    } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

    // ============================================================
    // 🔥 REMPLACE ICI PAR TA CONFIG FIREBASE
    // ============================================================
    const firebaseConfig = {
      apiKey: "AIzaSyDNVtDYK2wGTnDvkzb7wyuZVLdMMiO0m4s",
      authDomain: "crokia-915de.firebaseapp.com",
      projectId: "crokia-915de",
      storageBucket: "crokia-915de.firebasestorage.app",
      messagingSenderId: "215253452068",
      appId: "1:215253452068:web:d96b4aca6155503bc75fb1"
    };
    // ============================================================

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    window._db = db;
    window._fbFns = { doc, setDoc, getDoc, collection, onSnapshot, orderBy, query, addDoc, serverTimestamp, getDocs, where };

    window._hashPw = async (pw) => {
      const enc = new TextEncoder().encode(pw);
      const buf = await crypto.subtle.digest("SHA-256", enc);
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
    };

    const savedUid = sessionStorage.getItem('crokia_uid');
    if (savedUid) {
      getDoc(doc(db, "users", savedUid)).then(snap => {
        if (snap.exists()) {
          window._currentUser = { uid: savedUid, ...snap.data() };
          window._isAdmin = snap.data().isAdmin === true;
          if (window._isAdmin) showAdminPanel(); else openMyChat();
        } else { showScreen('loginScreen'); }
      }).catch(() => showScreen('loginScreen'));
    } else { showScreen('loginScreen'); }

    window._signOut = () => {
      sessionStorage.removeItem('crokia_uid');
      window._currentUser = null; window._isAdmin = false;
      showScreen('loginScreen');
    };
  </script>

  <style>
    /* ===== RESET & ROOT ===== */
    :root {
      --bg: #0d0d0f;
      --bg2: #161618;
      --bg3: #1e1e21;
      --border: rgba(255, 255, 255, 0.08);
      --border2: rgba(255, 255, 255, 0.14);
      --text: #f0f0f2;
      --muted: #888890;
      --accent: #7c6aff;
      --accent2: #a855f7;
      --green: #22c55e;
      --red: #ef4444;
      --radius: 18px;
      --radius-sm: 10px;
      --phone-w: 390px;
      --phone-h: 844px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      height: 100%;
      font-family: 'DM Sans', sans-serif;
      color: var(--text);
      overflow: hidden;
    }

    /* ===== DESKTOP WRAPPER (mockup téléphone) ===== */
    body {
      background: #070709;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Grille de points en fond */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: radial-gradient(rgba(124, 106, 255, 0.12) 1px, transparent 1px);
      background-size: 28px 28px;
      pointer-events: none;
    }

    #phoneShell {
      position: relative;
      width: var(--phone-w);
      height: var(--phone-h);
      background: var(--bg);
      border-radius: 52px;
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.08),
        0 0 0 10px #111113,
        0 0 0 11px rgba(255, 255, 255, 0.06),
        0 50px 120px rgba(0, 0, 0, 0.8),
        0 0 60px rgba(124, 106, 255, 0.08);
      overflow: hidden;
      flex-shrink: 0;
    }

    /* Encoche dynamique */
    #phoneShell::before {
      content: '';
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 34px;
      background: #070709;
      border-radius: 0 0 22px 22px;
      z-index: 1000;
    }

    /* Boutons latéraux */
    #phoneShell::after {
      content: '';
      position: absolute;
      right: -12px;
      top: 130px;
      width: 4px;
      height: 70px;
      background: #222224;
      border-radius: 2px;
      box-shadow: 0 90px 0 #222224, 0 -90px 0 #222224;
    }

    /* Barre de statut simulée */
    #statusBar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 44px;
      z-index: 999;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      padding: 0 28px 6px;
      pointer-events: none;
    }

    .sb-time {
      font-family: 'Syne', sans-serif;
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
    }

    .sb-icons {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .sb-icons svg {
      width: 14px;
      height: 14px;
      fill: var(--text);
    }

    /* ===== APP CONTAINER ===== */
    #appRoot {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }

    .screen {
      display: none;
      flex-direction: column;
      height: 100%;
    }

    .screen.active {
      display: flex;
    }

    /* ===== LOGIN ===== */
    #loginScreen {
      align-items: center;
      justify-content: center;
      background: var(--bg);
      padding: 24px 20px;
      overflow-y: auto;
    }

    .login-logo {
      font-family: 'Syne', sans-serif;
      font-size: 38px;
      font-weight: 700;
      letter-spacing: -2px;
      margin-bottom: 6px;
      margin-top: 20px;
    }

    .login-logo span {
      color: var(--accent);
    }

    .login-sub {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 28px;
      text-align: center;
    }

    .login-card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px 20px;
      width: 100%;
    }

    .login-tabs {
      display: flex;
      gap: 4px;
      margin-bottom: 20px;
      background: var(--bg3);
      padding: 4px;
      border-radius: var(--radius-sm);
    }

    .login-tab {
      flex: 1;
      padding: 8px;
      border: none;
      background: transparent;
      color: var(--muted);
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      border-radius: 7px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .login-tab.active {
      background: var(--accent);
      color: white;
      font-weight: 600;
    }

    .login-label {
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 6px;
    }

    .login-input {
      width: 100%;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 11px 14px;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      outline: none;
      margin-bottom: 12px;
      transition: border 0.2s;
    }

    .login-input:focus {
      border-color: var(--accent);
    }

    .login-btn {
      width: 100%;
      padding: 12px;
      background: var(--accent);
      border: none;
      border-radius: var(--radius-sm);
      color: white;
      font-family: 'Syne', sans-serif;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
      margin-bottom: 10px;
    }

    .login-btn:active {
      opacity: 0.8;
    }

    .login-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .login-admin-btn {
      width: 100%;
      padding: 11px;
      background: transparent;
      border: 1px solid var(--border2);
      border-radius: var(--radius-sm);
      color: var(--muted);
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .login-admin-btn:active {
      background: var(--bg3);
    }

    .admin-note {
      font-size: 11px;
      color: var(--muted);
      text-align: center;
      margin-top: 8px;
    }

    .login-error {
      font-size: 12px;
      color: var(--red);
      text-align: center;
      margin-bottom: 10px;
      min-height: 16px;
    }

    /* ===== ADMIN ===== */
    #adminScreen {
      background: var(--bg);
    }

    .admin-header {
      padding: 52px 16px 12px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .admin-title-wrap {
      flex: 1;
    }

    .admin-title {
      font-family: 'Syne', sans-serif;
      font-size: 18px;
      font-weight: 700;
    }

    .admin-subtitle {
      font-size: 11px;
      color: var(--muted);
      margin-top: 1px;
    }

    .admin-badge {
      background: rgba(124, 106, 255, 0.15);
      color: var(--accent);
      font-size: 10px;
      padding: 3px 8px;
      border-radius: 99px;
      border: 1px solid rgba(124, 106, 255, 0.3);
    }

    .admin-list {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .admin-footer {
      padding: 12px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    .my-chat-btn {
      flex: 1;
      padding: 12px;
      background: var(--accent);
      border: none;
      border-radius: var(--radius-sm);
      color: white;
      font-family: 'Syne', sans-serif;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .logout-btn {
      padding: 12px 14px;
      background: transparent;
      border: 1px solid var(--border2);
      border-radius: var(--radius-sm);
      color: var(--muted);
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      cursor: pointer;
    }

    /* Carte user dans admin */
    .user-card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      transition: all 0.2s;
    }

    .user-card-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px;
      cursor: pointer;
    }

    .user-card-header:active {
      background: var(--bg3);
    }

    .av {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Syne', sans-serif;
      font-size: 13px;
      font-weight: 700;
      flex-shrink: 0;
    }

    .av-a {
      background: rgba(34, 197, 94, 0.15);
      color: #22c55e;
      border: 1px solid rgba(34, 197, 94, 0.3);
    }

    .av-b {
      background: rgba(249, 115, 22, 0.15);
      color: #f97316;
      border: 1px solid rgba(249, 115, 22, 0.3);
    }

    .av-c {
      background: rgba(236, 72, 153, 0.15);
      color: #ec4899;
      border: 1px solid rgba(236, 72, 153, 0.3);
    }

    .user-info {
      flex: 1;
    }

    .user-name {
      font-family: 'Syne', sans-serif;
      font-size: 14px;
      font-weight: 600;
    }

    .user-meta {
      font-size: 11px;
      color: var(--muted);
      margin-top: 1px;
    }

    .expand-icon {
      color: var(--muted);
      font-size: 12px;
      transition: transform 0.3s;
    }

    .user-card.open .expand-icon {
      transform: rotate(180deg);
    }

    .view-btn {
      padding: 6px 12px;
      background: rgba(124, 106, 255, 0.15);
      border: 1px solid rgba(124, 106, 255, 0.3);
      border-radius: 99px;
      color: var(--accent);
      font-size: 11px;
      font-family: 'DM Sans', sans-serif;
      cursor: pointer;
      flex-shrink: 0;
    }

    .view-btn:active {
      background: rgba(124, 106, 255, 0.3);
    }

    /* Messages inline dans l'admin */
    .admin-conv {
      display: none;
      border-top: 1px solid var(--border);
      padding: 12px;
      max-height: 320px;
      overflow-y: auto;
      flex-direction: column;
      gap: 8px;
      background: rgba(0, 0, 0, 0.2);
    }

    .user-card.open .admin-conv {
      display: flex;
    }

    .adm-msg {
      display: flex;
      gap: 8px;
      align-items: flex-start;
    }

    .adm-msg.user-msg {
      flex-direction: row-reverse;
    }

    .adm-av {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      font-weight: 700;
      font-family: 'Syne', sans-serif;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .adm-bubble {
      max-width: 80%;
      padding: 8px 11px;
      border-radius: 14px;
      font-size: 12px;
      line-height: 1.5;
      word-wrap: break-word;
    }

    .adm-bubble.ai {
      background: var(--bg3);
      color: var(--text);
      border-radius: 4px 14px 14px 14px;
    }

    .adm-bubble.user {
      background: var(--accent);
      color: white;
      border-radius: 14px 4px 14px 14px;
    }

    .adm-bubble img {
      max-width: 100%;
      border-radius: 8px;
      display: block;
      margin-top: 3px;
    }

    .adm-time {
      font-size: 10px;
      color: var(--muted);
      margin-top: 2px;
    }

    .adm-empty {
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      padding: 16px 0;
    }

    .adm-loading {
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      padding: 12px 0;
      animation: pulse 1s infinite;
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1
      }

      50% {
        opacity: 0.3
      }
    }

    /* ===== CHAT ===== */
    #chatScreen {
      background: var(--bg);
    }

    .chat-header {
      padding: 50px 14px 12px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .back-btn {
      width: 34px;
      height: 34px;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      font-size: 15px;
    }

    .chat-info {
      flex: 1;
    }

    .chat-name {
      font-family: 'Syne', sans-serif;
      font-size: 15px;
      font-weight: 700;
    }

    .chat-status {
      font-size: 11px;
      color: var(--green);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .chat-status::before {
      content: '';
      width: 5px;
      height: 5px;
      background: var(--green);
      border-radius: 50%;
      display: inline-block;
    }

    .readonly-badge {
      background: rgba(249, 115, 22, 0.12);
      color: #f97316;
      font-size: 10px;
      padding: 3px 8px;
      border-radius: 99px;
      border: 1px solid rgba(249, 115, 22, 0.25);
    }

    .chat-logout {
      color: var(--muted);
      font-size: 18px;
      cursor: pointer;
      padding: 4px;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      scroll-behavior: smooth;
    }

    .msg-row {
      display: flex;
      align-items: flex-end;
      gap: 7px;
    }

    .msg-row.user {
      flex-direction: row-reverse;
    }

    .msg-av {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 700;
      font-family: 'Syne', sans-serif;
      flex-shrink: 0;
    }

    .bubble {
      max-width: 78%;
      padding: 9px 13px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.55;
      word-wrap: break-word;
    }

    .bubble.ai {
      background: var(--bg3);
      color: var(--text);
      border-radius: 4px 16px 16px 16px;
    }

    .bubble.user {
      background: var(--accent);
      color: white;
      border-radius: 16px 4px 16px 16px;
    }

    .bubble.readonly-user {
      background: var(--bg2);
      border: 1px solid var(--border2);
      color: var(--text);
      border-radius: 4px 16px 16px 16px;
    }

    .bubble img {
      max-width: 100%;
      border-radius: 10px;
      display: block;
      margin-top: 4px;
    }

    .bubble-time {
      font-size: 10px;
      color: var(--muted);
      margin-top: 2px;
      text-align: right;
    }

    .typing {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 10px 14px;
      background: var(--bg3);
      border-radius: 4px 16px 16px 16px;
      width: fit-content;
    }

    .typing span {
      width: 5px;
      height: 5px;
      background: var(--muted);
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }

    .typing span:nth-child(2) {
      animation-delay: 0.2s;
    }

    .typing span:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes bounce {

      0%,
      60%,
      100% {
        transform: translateY(0);
        opacity: 0.4
      }

      30% {
        transform: translateY(-5px);
        opacity: 1
      }
    }

    .input-bar {
      padding: 8px 12px 28px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 8px;
      align-items: flex-end;
      background: var(--bg);
      flex-shrink: 0;
    }

    .input-wrap {
      flex: 1;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 20px;
      display: flex;
      align-items: flex-end;
      padding: 7px 12px;
      gap: 7px;
      transition: border 0.2s;
    }

    .input-wrap:focus-within {
      border-color: var(--accent);
    }

    #msgInput {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      resize: none;
      max-height: 100px;
      line-height: 1.5;
    }

    #msgInput::placeholder {
      color: var(--muted);
    }

    .img-label {
      cursor: pointer;
      color: var(--muted);
      font-size: 18px;
      padding-bottom: 1px;
      transition: color 0.2s;
    }

    .img-label:hover {
      color: var(--accent);
    }

    #imgInput {
      display: none;
    }

    .send-btn {
      width: 38px;
      height: 38px;
      background: var(--accent);
      border: none;
      border-radius: 50%;
      color: white;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: opacity 0.2s;
    }

    .send-btn:active {
      opacity: 0.8;
    }

    .readonly-bar {
      padding: 12px 14px 24px;
      border-top: 1px solid var(--border);
      background: var(--bg);
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      flex-shrink: 0;
    }

    .readonly-bar strong {
      color: #f97316;
    }

    /* Loader */
    #loader {
      position: absolute;
      inset: 0;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      border-radius: 52px;
    }

    .loader-logo {
      font-family: 'Syne', sans-serif;
      font-size: 32px;
      font-weight: 700;
      letter-spacing: -2px;
      animation: pls 1.5s infinite;
    }

    .loader-logo span {
      color: var(--accent);
    }

    @keyframes pls {

      0%,
      100% {
        opacity: 1
      }

      50% {
        opacity: 0.3
      }
    }

    /* ===== RESPONSIVE : sur mobile réel, pas de mockup ===== */
    @media (max-width: 430px) {
      body {
        display: block;
        background: var(--bg);
      }

      body::before {
        display: none;
      }

      #phoneShell {
        width: 100%;
        height: 100%;
        border-radius: 0;
        box-shadow: none;
      }

      #phoneShell::before,
      #phoneShell::after {
        display: none;
      }

      #statusBar {
        display: none;
      }
    }
  </style>
</head>

<body>

  <!-- MOCKUP TÉLÉPHONE -->
  <div id="phoneShell">

    <!-- Barre de statut simulée -->
    <div id="statusBar">
      <span class="sb-time" id="sbTime">9:41</span>
      <div class="sb-icons">
        <!-- Signal -->
        <svg viewBox="0 0 24 24">
          <rect x="0" y="15" width="4" height="9" rx="1" />
          <rect x="6" y="10" width="4" height="14" rx="1" />
          <rect x="12" y="5" width="4" height="19" rx="1" />
          <rect x="18" y="0" width="4" height="24" rx="1" opacity=".3" />
        </svg>
        <!-- WiFi -->
        <svg viewBox="0 0 24 24">
          <path d="M12 4C7.31 4 3.07 5.9 0 9l2 2c2.55-2.55 6.07-4 10-4s7.45 1.45 10 4l2-2C21.08 5.9 16.69 4 12 4z"
            opacity=".3" />
          <path
            d="M12 8c-3.31 0-6.29 1.35-8.46 3.54L5.5 13.5C7.14 11.86 9.45 11 12 11s4.86.86 6.5 2.5l1.96-1.96A10.93 10.93 0 0012 8z"
            opacity=".6" />
          <path
            d="M12 12c-2.21 0-4.21.9-5.66 2.34L8 16c1.1-1.1 2.62-1.78 4.3-1.78 1.68 0 3.19.68 4.29 1.78l1.65-1.65A7.94 7.94 0 0012 12z" />
          <circle cx="12" cy="20" r="2" />
        </svg>
        <!-- Batterie -->
        <svg viewBox="0 0 24 12" style="width:22px;height:12px">
          <rect x="0" y="0" width="20" height="12" rx="3" stroke="white" stroke-width="1.2" fill="none" />
          <rect x="20.5" y="3.5" width="2" height="5" rx="1" fill="white" opacity=".5" />
          <rect x="1.5" y="1.5" width="15" height="9" rx="2" fill="white" />
        </svg>
      </div>
    </div>

    <!-- Loader -->
    <div id="loader">
      <div class="loader-logo">crok<span>IA</span></div>
    </div>

    <!-- APP -->
    <div id="appRoot">

      <!-- LOGIN -->
      <div class="screen" id="loginScreen">
        <div class="login-logo">crok<span>IA</span></div>
        <div class="login-sub">Ton assistant personnel. Toujours là.</div>
        <div class="login-card">
          <div class="login-tabs">
            <button class="login-tab active" id="tabSignin" onclick="switchTab('signin')">Connexion</button>
            <button class="login-tab" id="tabSignup" onclick="switchTab('signup')">Inscription</button>
          </div>
          <div class="login-label">Pseudo</div>
          <input class="login-input" id="pseudoInput" type="text" placeholder="Ex : Thomas" maxlength="20"
            autocomplete="off">
          <div class="login-label">Mot de passe</div>
          <input class="login-input" id="pwInput" type="password" placeholder="••••••••"
            autocomplete="current-password">
          <div class="login-error" id="loginError"></div>
          <button class="login-btn" id="loginBtn" onclick="handleAuth()">Commencer à chatter ✦</button>
          <button class="login-admin-btn" onclick="loginAdmin()">🔐 Accès admin</button>
          <div class="admin-note">Admin = voir toutes les convos</div>
        </div>
      </div>

      <!-- ADMIN -->
      <div class="screen" id="adminScreen">
        <div class="admin-header">
          <div class="admin-title-wrap">
            <div class="admin-title">👑 Admin</div>
            <div class="admin-subtitle">Toutes les conversations</div>
          </div>
          <span class="admin-badge">Vue globale</span>
        </div>
        <div class="admin-list" id="adminList"></div>
        <div class="admin-footer">
          <button class="my-chat-btn" onclick="openMyChat()">💬 Ma conversation</button>
          <button class="logout-btn" onclick="doLogout()">⏻</button>
        </div>
      </div>

      <!-- CHAT -->
      <div class="screen" id="chatScreen">
        <div class="chat-header">
          <div class="back-btn" onclick="goBack()">←</div>
          <div class="chat-info">
            <div class="chat-name" id="chatName">IA</div>
            <div class="chat-status">en ligne</div>
          </div>
          <span class="readonly-badge" id="readonlyBadge" style="display:none">👁 lecture</span>
          <span class="chat-logout" onclick="doLogout()" title="Déconnexion">⏻</span>
        </div>
        <div class="messages" id="messages"></div>
        <div class="input-bar" id="inputBar">
          <div class="input-wrap">
            <label class="img-label" title="Image">📎<input type="file" id="imgInput" accept="image/*"
                onchange="sendImage(this)"></label>
            <textarea id="msgInput" placeholder="Écris un message..." rows="1" onkeydown="handleKey(event)"
              oninput="autoResize(this)"></textarea>
          </div>
          <button class="send-btn" onclick="sendMsg()">➤</button>
        </div>
        <div class="readonly-bar" id="readonlyBar" style="display:none">
          👁 Conv de <strong id="readonlyName"></strong> — lecture seule
        </div>
      </div>

    </div><!-- /appRoot -->
  </div><!-- /phoneShell -->

  <script>
    const ADMIN_CODE = "admin123";
    const GEMINI_KEY = "AIzaSyCiojeP9lEeCmXIEyLN50aJH8I1VvbdJeY";
    const SYSTEM_PROMPT = "Tu es une IA assistante sympathique et moderne. Réponds en français, de façon naturelle, chaleureuse et concise. Tu peux utiliser des emojis avec modération. Si l'utilisateur envoie une image, décris-la brièvement et réponds en contexte.";

    let currentTab = 'signin';
    let currentReadonly = null;
    let localMessages = [];
    let unsubMessages = null;

    // Horloge temps réel dans la status bar
    function updateClock() {
      const d = new Date();
      const el = document.getElementById('sbTime');
      if (el) el.textContent = d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0');
    }
    updateClock(); setInterval(updateClock, 10000);

    // ===== UI =====
    function showScreen(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
      document.getElementById('loader').style.display = 'none';
    }
    function setError(msg) { document.getElementById('loginError').textContent = msg; }

    function switchTab(tab) {
      currentTab = tab;
      document.getElementById('tabSignin').classList.toggle('active', tab === 'signin');
      document.getElementById('tabSignup').classList.toggle('active', tab === 'signup');
      document.getElementById('loginBtn').textContent = tab === 'signup' ? "Créer mon compte ✦" : "Commencer à chatter ✦";
      setError('');
    }

    // ===== AUTH =====
    async function handleAuth() {
      const pseudo = document.getElementById('pseudoInput').value.trim();
      const pw = document.getElementById('pwInput').value;
      const btn = document.getElementById('loginBtn');
      setError('');
      if (!pseudo) { setError("Entre un pseudo."); return; }
      if (!pw || pw.length < 6) { setError("Mot de passe trop court (6 chars min)."); return; }
      btn.disabled = true; btn.textContent = "...";

      try {
        const db = window._db;
        const { doc, setDoc, getDoc, collection, getDocs, query, where } = window._fbFns;
        const pwHash = await window._hashPw(pw);

        if (currentTab === 'signup') {
          const q = query(collection(db, "users"), where("pseudo", "==", pseudo));
          const snap = await getDocs(q);
          if (!snap.empty) { setError("Ce pseudo est déjà pris."); btn.disabled = false; btn.textContent = "Créer mon compte ✦"; return; }
          const uid = pseudo.toLowerCase().replace(/[^a-z0-9]/g, '_') + '_' + Date.now();
          await setDoc(doc(db, "users", uid), { pseudo, pwHash, isAdmin: false, createdAt: new Date().toISOString() });
          window._currentUser = { uid, pseudo, isAdmin: false };
          sessionStorage.setItem('crokia_uid', uid);
          openMyChat();
        } else {
          const q = query(collection(db, "users"), where("pseudo", "==", pseudo));
          const snap = await getDocs(q);
          if (snap.empty) { setError("Pseudo introuvable."); btn.disabled = false; btn.textContent = "Commencer à chatter ✦"; return; }
          const userDoc = snap.docs[0];
          const data = userDoc.data();
          if (data.pwHash !== pwHash) { setError("Mot de passe incorrect."); btn.disabled = false; btn.textContent = "Commencer à chatter ✦"; return; }
          window._currentUser = { uid: userDoc.id, ...data };
          window._isAdmin = data.isAdmin === true;
          sessionStorage.setItem('crokia_uid', userDoc.id);
          if (window._isAdmin) showAdminPanel(); else openMyChat();
        }
      } catch (e) {
        setError("Erreur: " + e.message);
        btn.disabled = false;
        btn.textContent = currentTab === 'signup' ? "Créer mon compte ✦" : "Commencer à chatter ✦";
      }
    }

    function loginAdmin() {
      const code = prompt("Code admin :");
      if (code !== ADMIN_CODE) { alert("Code incorrect."); return; }
      window._isAdmin = true;
      showAdminPanel();
    }

    function doLogout() {
      if (unsubMessages) { unsubMessages(); unsubMessages = null; }
      window._signOut();
    }

    // ===== ADMIN — affiche toutes les convos déroulables =====
    async function showAdminPanel() {
      showScreen('adminScreen');
      const { collection, getDocs, query, orderBy } = window._fbFns;
      const db = window._db;
      const list = document.getElementById('adminList');
      list.innerHTML = '<div style="text-align:center;color:var(--muted);padding:20px 0;font-size:13px">Chargement...</div>';

      try {
        const usersSnap = await getDocs(collection(db, "users"));
        list.innerHTML = '';
        const colors = ['a', 'b', 'c'];

        if (usersSnap.empty) {
          list.innerHTML = '<div style="text-align:center;color:var(--muted);padding:30px 0;font-size:13px">Aucun utilisateur pour l\'instant.</div>';
          return;
        }

        let i = 0;
        for (const userDoc of usersSnap.docs) {
          const profile = userDoc.data();
          const uid = userDoc.id;

          // Charge les messages
          const msgsSnap = await getDocs(query(collection(db, "conversations", uid, "messages"), orderBy("createdAt", "asc")));
          const msgs = msgsSnap.docs.map(d => d.data());
          const count = msgs.length;

          const card = document.createElement('div');
          card.className = 'user-card';
          card.id = 'card_' + uid;

          // Header cliquable
          const header = document.createElement('div');
          header.className = 'user-card-header';
          header.innerHTML = `
        <div class="av av-${colors[i % 3]}">${escHtml(profile.pseudo).slice(0, 2).toUpperCase()}</div>
        <div class="user-info">
          <div class="user-name">${escHtml(profile.pseudo)}</div>
          <div class="user-meta">${count} message${count !== 1 ? 's' : ''}</div>
        </div>
        <span class="expand-icon">▾</span>
      `;
          header.onclick = () => toggleConv(card, uid, profile.pseudo, msgs);
          card.appendChild(header);

          // Zone conversation (cachée par défaut)
          const convDiv = document.createElement('div');
          convDiv.className = 'admin-conv';
          convDiv.id = 'conv_' + uid;
          if (msgs.length === 0) {
            convDiv.innerHTML = '<div class="adm-empty">Aucun message pour l\'instant.</div>';
          } else {
            renderAdminConv(convDiv, msgs, profile.pseudo);
          }
          card.appendChild(convDiv);

          list.appendChild(card);
          i++;
        }
      } catch (e) {
        list.innerHTML = `<div style="text-align:center;color:#ef4444;padding:20px;font-size:13px">Erreur: ${e.message}</div>`;
      }
    }

    function toggleConv(card, uid, pseudo, msgs) {
      const isOpen = card.classList.contains('open');
      // Ferme tous les autres
      document.querySelectorAll('.user-card.open').forEach(c => c.classList.remove('open'));
      if (!isOpen) card.classList.add('open');
    }

    function renderAdminConv(container, msgs, pseudo) {
      container.innerHTML = '';
      const initials = pseudo.slice(0, 2).toUpperCase();
      msgs.forEach(m => {
        const row = document.createElement('div');
        if (m.role === 'user') {
          row.className = 'adm-msg user-msg';
          let inner = '';
          if (m.text) inner += escHtml(m.text);
          if (m.img) inner += `<img src="${m.img}" alt="image">`;
          row.innerHTML = `
        <div class="adm-bubble user">${inner}<div class="adm-time">${m.time || ''}</div></div>
        <div class="adm-av" style="background:linear-gradient(135deg,var(--accent),var(--accent2));color:white">${initials}</div>
      `;
        } else {
          row.className = 'adm-msg';
          row.innerHTML = `
        <div class="adm-av" style="background:var(--bg3);border:1px solid var(--border2);font-size:11px">✦</div>
        <div class="adm-bubble ai">${escHtml(m.text || '')}<div class="adm-time">${m.time || ''}</div></div>
      `;
        }
        container.appendChild(row);
      });
      // Scroll en bas dans la conv admin
      setTimeout(() => { container.scrollTop = container.scrollHeight; }, 50);
    }

    // ===== CHAT =====
    function openReadonly(uid, pseudo) {
      currentReadonly = { uid, pseudo };
      document.getElementById('chatName').textContent = pseudo + ' — conv';
      document.getElementById('readonlyBadge').style.display = '';
      document.getElementById('inputBar').style.display = 'none';
      document.getElementById('readonlyBar').style.display = '';
      document.getElementById('readonlyName').textContent = pseudo;
      showScreen('chatScreen');
      listenMessages(uid, true);
    }

    function openMyChat() {
      currentReadonly = null;
      const user = window._currentUser;
      const pseudo = user ? user.pseudo : 'Admin';
      const uid = user ? user.uid : '__admin__';
      document.getElementById('chatName').textContent = 'Crok IA × ' + pseudo;
      document.getElementById('readonlyBadge').style.display = 'none';
      document.getElementById('inputBar').style.display = 'flex';
      document.getElementById('readonlyBar').style.display = 'none';
      showScreen('chatScreen');
      listenMessages(uid, false);
    }

    function goBack() {
      if (unsubMessages) { unsubMessages(); unsubMessages = null; }
      if (window._isAdmin) showAdminPanel(); else showScreen('loginScreen');
    }

    function listenMessages(uid, readonly) {
      if (unsubMessages) { unsubMessages(); unsubMessages = null; }
      const { collection, query, orderBy, onSnapshot } = window._fbFns;
      const q = query(collection(window._db, "conversations", uid, "messages"), orderBy("createdAt", "asc"));
      unsubMessages = onSnapshot(q, (snap) => {
        localMessages = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        renderMessages(localMessages, readonly);
      });
    }

    async function saveMessage(uid, msg) {
      const { collection, addDoc, serverTimestamp } = window._fbFns;
      await addDoc(collection(window._db, "conversations", uid, "messages"), { ...msg, createdAt: serverTimestamp() });
    }

    function renderMessages(msgs, isReadonly) {
      const el = document.getElementById('messages');
      el.innerHTML = '';
      const displayName = isReadonly ? (currentReadonly?.pseudo || 'User') : (window._currentUser?.pseudo || 'Admin');
      const initials = displayName.slice(0, 2).toUpperCase();

      msgs.forEach(m => {
        const row = document.createElement('div');
        if (m.role === 'user') {
          row.className = 'msg-row user';
          const bubbleClass = isReadonly ? 'bubble readonly-user' : 'bubble user';
          let inner = '';
          if (m.text) inner += escHtml(m.text);
          if (m.img) inner += `<img src="${m.img}" alt="image">`;
          inner += `<div class="bubble-time">${m.time || ''}</div>`;
          const avStyle = isReadonly
            ? 'background:rgba(249,115,22,0.15);color:#f97316;border:1px solid rgba(249,115,22,0.3)'
            : 'background:linear-gradient(135deg,var(--accent),var(--accent2));color:white';
          row.innerHTML = `<div class="bubble ${bubbleClass}">${inner}</div><div class="msg-av" style="${avStyle}">${initials}</div>`;
        } else {
          row.className = 'msg-row ai';
          row.innerHTML = `<div class="msg-av" style="background:var(--bg3);border:1px solid var(--border2);font-size:14px">✦</div><div class="bubble ai">${escHtml(m.text || '')}<div class="bubble-time">${m.time || ''}</div></div>`;
        }
        el.appendChild(row);
      });
      el.scrollTop = el.scrollHeight;
    }

    function escHtml(t) {
      if (!t) return '';
      return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/\n/g, '<br>');
    }
    function nowStr() { const d = new Date(); return d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0'); }

    async function sendMsg() {
      if (currentReadonly) return;
      const inp = document.getElementById('msgInput');
      const text = inp.value.trim();
      if (!text) return;
      inp.value = ''; inp.style.height = '';
      const uid = window._currentUser?.uid || '__admin__';
      await saveMessage(uid, { role: 'user', text, time: nowStr() });
      await askAI(text, null, uid);
    }

    async function sendImage(input) {
      if (!input.files[0] || currentReadonly) return;
      const reader = new FileReader();
      reader.onload = async (e) => {
        const src = e.target.result;
        const uid = window._currentUser?.uid || '__admin__';
        await saveMessage(uid, { role: 'user', img: src, text: '', time: nowStr() });
        await askAI("J'ai envoyé une image.", src, uid);
        input.value = '';
      };
      reader.readAsDataURL(input.files[0]);
    }

    function showTyping() {
      const el = document.getElementById('messages');
      const div = document.createElement('div');
      div.className = 'msg-row ai'; div.id = 'typing';
      div.innerHTML = `<div class="msg-av" style="background:var(--bg3);border:1px solid var(--border2);font-size:14px">✦</div><div class="typing"><span></span><span></span><span></span></div>`;
      el.appendChild(div); el.scrollTop = el.scrollHeight;
    }
    function removeTyping() { const t = document.getElementById('typing'); if (t) t.remove(); }

    async function askAI(userText, imgData, uid) {
      const contents = [];
      contents.push({ role: 'user', parts: [{ text: SYSTEM_PROMPT }] });
      contents.push({ role: 'model', parts: [{ text: "Compris, je suis prêt !" }] });
      localMessages.filter(m => m.role === 'user' || m.role === 'ai').forEach(m => {
        if (m.role === 'ai') {
          contents.push({ role: 'model', parts: [{ text: m.text }] });
        } else {
          const parts = [];
          if (m.img && m.img.startsWith('data:image')) {
            const b64 = m.img.split(',')[1], mime = m.img.split(';')[0].split(':')[1];
            parts.push({ inlineData: { mimeType: mime, data: b64 } });
          }
          parts.push({ text: m.text || 'Voici une image.' });
          contents.push({ role: 'user', parts });
        }
      });
      showTyping();
      try {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-lite:generateContent?key=${GEMINI_KEY}`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ contents })
        });
        if (!res.ok) { const err = await res.json(); throw new Error(JSON.stringify(err)); }
        const data = await res.json();
        const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || "Désolé, je n'ai pas pu répondre.";
        removeTyping();
        await saveMessage(uid, { role: 'ai', text: reply, time: nowStr() });
      } catch (e) {
        removeTyping();
        await saveMessage(uid, { role: 'ai', text: "Erreur: " + e.message, time: nowStr() });
      }
    }

    function handleKey(e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMsg(); } }
    function autoResize(el) { el.style.height = ''; el.style.height = Math.min(el.scrollHeight, 100) + 'px'; }

    document.getElementById('pwInput').addEventListener('keydown', e => { if (e.key === 'Enter') handleAuth(); });
    document.getElementById('pseudoInput').addEventListener('keydown', e => { if (e.key === 'Enter') handleAuth(); });
  </script>
</body>

</html>
