<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Crok IA</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0d0d0f;
  --bg2: #161618;
  --bg3: #1e1e21;
  --border: rgba(255,255,255,0.08);
  --border2: rgba(255,255,255,0.14);
  --text: #f0f0f2;
  --muted: #888890;
  --accent: #7c6aff;
  --accent2: #a855f7;
  --green: #22c55e;
  --bubble-user: #7c6aff;
  --bubble-ai: #1e1e21;
  --radius: 18px;
  --radius-sm: 10px;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; background: var(--bg); font-family: 'DM Sans', sans-serif; color: var(--text); }

/* SCREENS */
.screen { display: none; flex-direction: column; height: 100vh; height: 100dvh; }
.screen.active { display: flex; }

/* LOGIN SCREEN */
#loginScreen {
  align-items: center; justify-content: center;
  background: var(--bg);
  padding: 32px 24px;
}
.login-logo { font-family: 'Syne', sans-serif; font-size: 42px; font-weight: 700; letter-spacing: -2px; margin-bottom: 8px; }
.login-logo span { color: var(--accent); }
.login-sub { color: var(--muted); font-size: 15px; margin-bottom: 48px; text-align: center; }
.login-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 28px 24px; width: 100%; max-width: 360px; }
.login-label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 8px; }
.login-input { width: 100%; background: var(--bg3); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 12px 16px; color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 15px; outline: none; margin-bottom: 16px; transition: border 0.2s; }
.login-input:focus { border-color: var(--accent); }
.login-btn { width: 100%; padding: 13px; background: var(--accent); border: none; border-radius: var(--radius-sm); color: white; font-family: 'Syne', sans-serif; font-size: 15px; font-weight: 600; cursor: pointer; transition: opacity 0.2s; margin-bottom: 12px; }
.login-btn:active { opacity: 0.8; }
.login-admin-btn { width: 100%; padding: 13px; background: transparent; border: 1px solid var(--border2); border-radius: var(--radius-sm); color: var(--muted); font-family: 'DM Sans', sans-serif; font-size: 14px; cursor: pointer; transition: all 0.2s; }
.login-admin-btn:active { background: var(--bg3); }
.admin-note { font-size: 12px; color: var(--muted); text-align: center; margin-top: 10px; }

/* ADMIN SCREEN */
#adminScreen { background: var(--bg); }
.admin-header { padding: 52px 20px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; }
.admin-crown { font-size: 22px; }
.admin-title { font-family: 'Syne', sans-serif; font-size: 20px; font-weight: 700; }
.admin-badge { margin-left: auto; background: rgba(124,106,255,0.15); color: var(--accent); font-size: 11px; padding: 4px 10px; border-radius: 99px; border: 1px solid rgba(124,106,255,0.3); }
.admin-list { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.conv-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; cursor: pointer; transition: all 0.2s; active-transform: scale(0.98); }
.conv-card:active { transform: scale(0.98); border-color: var(--accent); }
.conv-card-top { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.av { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: 'Syne', sans-serif; font-size: 14px; font-weight: 700; flex-shrink: 0; }
.av-self { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: white; }
.av-a { background: rgba(34,197,94,0.15); color: #22c55e; border: 1px solid rgba(34,197,94,0.3); }
.av-b { background: rgba(249,115,22,0.15); color: #f97316; border: 1px solid rgba(249,115,22,0.3); }
.av-c { background: rgba(236,72,153,0.15); color: #ec4899; border: 1px solid rgba(236,72,153,0.3); }
.conv-name { font-family: 'Syne', sans-serif; font-size: 15px; font-weight: 600; }
.conv-count { margin-left: auto; background: var(--bg3); color: var(--muted); font-size: 11px; padding: 3px 8px; border-radius: 99px; }
.conv-preview { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.admin-footer { padding: 16px; border-top: 1px solid var(--border); }
.my-chat-btn { width: 100%; padding: 14px; background: var(--accent); border: none; border-radius: var(--radius-sm); color: white; font-family: 'Syne', sans-serif; font-size: 15px; font-weight: 600; cursor: pointer; }

/* CHAT SCREEN */
#chatScreen { background: var(--bg); }
.chat-header { padding: 52px 16px 14px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; }
.back-btn { width: 36px; height: 36px; background: var(--bg3); border: 1px solid var(--border); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; font-size: 16px; }
.chat-info { flex: 1; }
.chat-name { font-family: 'Syne', sans-serif; font-size: 16px; font-weight: 700; }
.chat-status { font-size: 12px; color: var(--green); display: flex; align-items: center; gap: 4px; }
.chat-status::before { content:''; width:6px; height:6px; background:var(--green); border-radius:50%; display:inline-block; }
.readonly-badge { background: rgba(249,115,22,0.12); color: #f97316; font-size: 11px; padding: 4px 10px; border-radius: 99px; border: 1px solid rgba(249,115,22,0.25); }

.messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; scroll-behavior: smooth; }
.msg-row { display: flex; align-items: flex-end; gap: 8px; }
.msg-row.user { flex-direction: row-reverse; }
.msg-av { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; font-family: 'Syne', sans-serif; flex-shrink: 0; }
.bubble { max-width: 75%; padding: 10px 14px; border-radius: 18px; font-size: 15px; line-height: 1.55; word-wrap: break-word; }
.bubble.ai { background: var(--bg3); color: var(--text); border-radius: 4px 18px 18px 18px; }
.bubble.user { background: var(--accent); color: white; border-radius: 18px 4px 18px 18px; }
.bubble.readonly-user { background: var(--bg2); border: 1px solid var(--border2); color: var(--text); border-radius: 4px 18px 18px 18px; }
.bubble img { max-width: 100%; border-radius: 10px; display: block; margin-top: 4px; }
.bubble-time { font-size: 11px; color: var(--muted); margin-top: 3px; text-align: right; }

.typing { display: flex; align-items: center; gap: 5px; padding: 12px 16px; background: var(--bg3); border-radius: 4px 18px 18px 18px; width: fit-content; }
.typing span { width: 6px; height: 6px; background: var(--muted); border-radius: 50%; animation: bounce 1.2s infinite; }
.typing span:nth-child(2) { animation-delay: 0.2s; }
.typing span:nth-child(3) { animation-delay: 0.4s; }
@keyframes bounce { 0%,60%,100%{transform:translateY(0);opacity:0.4} 30%{transform:translateY(-5px);opacity:1} }

.input-bar { padding: 12px 16px 28px; border-top: 1px solid var(--border); display: flex; gap: 10px; align-items: flex-end; background: var(--bg); }
.input-wrap { flex: 1; background: var(--bg2); border: 1px solid var(--border); border-radius: 22px; display: flex; align-items: flex-end; padding: 8px 14px; gap: 8px; transition: border 0.2s; }
.input-wrap:focus-within { border-color: var(--accent); }
#msgInput { flex: 1; background: transparent; border: none; outline: none; color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 15px; resize: none; max-height: 120px; line-height: 1.5; }
#msgInput::placeholder { color: var(--muted); }
.img-label { cursor: pointer; color: var(--muted); font-size: 20px; padding-bottom: 1px; transition: color 0.2s; }
.img-label:hover { color: var(--accent); }
#imgInput { display: none; }
.send-btn { width: 42px; height: 42px; background: var(--accent); border: none; border-radius: 50%; color: white; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: opacity 0.2s; }
.send-btn:active { opacity: 0.8; }

.readonly-bar { padding: 14px 16px 28px; border-top: 1px solid var(--border); background: var(--bg); text-align: center; color: var(--muted); font-size: 13px; }
.readonly-bar strong { color: #f97316; }
</style>
</head>
<body>

<!-- LOGIN -->
<div class="screen active" id="loginScreen">
  <div class="login-logo">crok<span>IA</span></div>
  <div class="login-sub">Ton assistant personnel. Toujours là.</div>
  <div class="login-card">
    <div class="login-label">Ton prénom</div>
    <input class="login-input" id="nameInput" type="text" placeholder="Ex : Thomas" maxlength="20" autocomplete="off">
    <button class="login-btn" onclick="login()">Commencer à chatter ✦</button>
    <button class="login-admin-btn" onclick="loginAdmin()">🔐 Accès admin</button>
    <div class="admin-note">Admin = voir toutes les convos</div>
  </div>
</div>

<!-- ADMIN PANEL -->
<div class="screen" id="adminScreen">
  <div class="admin-header">
    <span class="admin-crown">👑</span>
    <span class="admin-title">Admin</span>
    <span class="admin-badge">Vue globale</span>
  </div>
  <div class="admin-list" id="adminList"></div>
  <div class="admin-footer">
    <button class="my-chat-btn" onclick="openMyChat()">💬 Ma conversation avec l'IA</button>
  </div>
</div>

<!-- CHAT -->
<div class="screen" id="chatScreen">
  <div class="chat-header">
    <div class="back-btn" onclick="goBack()">←</div>
    <div class="chat-info">
      <div class="chat-name" id="chatName">IA</div>
      <div class="chat-status">en ligne</div>
    </div>
    <span class="readonly-badge" id="readonlyBadge" style="display:none">👁 lecture</span>
  </div>
  <div class="messages" id="messages"></div>
  <div class="input-bar" id="inputBar">
    <div class="input-wrap">
      <label class="img-label" title="Envoyer une image">📎<input type="file" id="imgInput" accept="image/*" onchange="sendImage(this)"></label>
      <textarea id="msgInput" placeholder="Écris un message..." rows="1" onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
    </div>
    <button class="send-btn" onclick="sendMsg()">➤</button>
  </div>
  <div class="readonly-bar" id="readonlyBar" style="display:none">
    👁 Tu vois la conv de <strong id="readonlyName"></strong> — lecture seule
  </div>
</div>

<script>
// ============ STORAGE ============
const ADMIN_CODE = "admin123";
const GEMINI_KEY = "AIzaSyCiojeP9lEeCmXIEyLN50aJH8I1VvbdJeY";
const SYSTEM_PROMPT = "Tu es une IA assistante sympathique et moderne. Réponds en français, de façon naturelle, chaleureuse et concise. Tu peux utiliser des emojis avec modération. Si l'utilisateur envoie une image, décris-la brièvement et réponds en contexte.";

function saveAll() { localStorage.setItem('monIA_convs', JSON.stringify(allConvs)); }
function loadAll() {
  try { return JSON.parse(localStorage.getItem('monIA_convs')) || {}; }
  catch(e) { return {}; }
}

let allConvs = loadAll();
let currentUser = null;
let currentReadonly = null;
let isAdmin = false;

// ============ LOGIN ============
function login() {
  const name = document.getElementById('nameInput').value.trim();
  if (!name) { document.getElementById('nameInput').style.borderColor='#f97316'; return; }
  currentUser = name;
  isAdmin = false;
  if (!allConvs[name]) allConvs[name] = [];
  saveAll();
  openMyChat();
}

function loginAdmin() {
  const code = prompt("Code admin :");
  if (code !== ADMIN_CODE) { alert("Code incorrect."); return; }
  currentUser = "__admin__";
  isAdmin = true;
  if (!allConvs['__admin__']) allConvs['__admin__'] = [];
  showAdmin();
}

// ============ ADMIN ============
function showAdmin() {
  allConvs = loadAll();
  showScreen('adminScreen');
  const list = document.getElementById('adminList');
  list.innerHTML = '';

  const users = Object.keys(allConvs).filter(u => u !== '__admin__');

  if (users.length === 0) {
    list.innerHTML = '<div style="text-align:center;color:var(--muted);padding:40px 0;font-size:14px;">Aucune conversation pour l\'instant.<br>Tes amis n\'ont pas encore utilisé l\'app.</div>';
    return;
  }

  const colors = ['a','b','c','a','b'];
  users.forEach((user, i) => {
    const convs = allConvs[user];
    const last = convs.filter(m => m.role === 'user').slice(-1)[0];
    const preview = last ? (last.img ? '📷 Image' : last.text) : 'Pas encore de message';
    const initials = user.slice(0,2).toUpperCase();
    const card = document.createElement('div');
    card.className = 'conv-card';
    card.innerHTML = `
      <div class="conv-card-top">
        <div class="av av-${colors[i%3]}">${initials}</div>
        <div class="conv-name">${user}</div>
        <div class="conv-count">${convs.length} msg</div>
      </div>
      <div class="conv-preview">${preview}</div>
    `;
    card.onclick = () => openReadonly(user);
    list.appendChild(card);
  });
}

function openReadonly(user) {
  currentReadonly = user;
  document.getElementById('chatName').textContent = user + ' — conv';
  document.getElementById('readonlyBadge').style.display = '';
  document.getElementById('inputBar').style.display = 'none';
  document.getElementById('readonlyBar').style.display = '';
  document.getElementById('readonlyName').textContent = user;
  showScreen('chatScreen');
  renderMessages(allConvs[user] || []);
}

function openMyChat() {
  currentReadonly = null;
  const name = isAdmin ? '__admin__' : currentUser;
  const displayName = isAdmin ? 'Admin' : currentUser;
  document.getElementById('chatName').textContent = 'Crok IA × ' + displayName;
  document.getElementById('readonlyBadge').style.display = 'none';
  document.getElementById('inputBar').style.display = 'flex';
  document.getElementById('readonlyBar').style.display = 'none';
  showScreen('chatScreen');
  renderMessages(allConvs[name] || []);
}

function goBack() {
  if (isAdmin) { showAdmin(); }
  else { showScreen('loginScreen'); }
}

// ============ CHAT ============
function renderMessages(msgs) {
  const el = document.getElementById('messages');
  el.innerHTML = '';
  const isReadonly = !!currentReadonly;
  const userName = currentReadonly || (isAdmin ? 'Admin' : currentUser);
  const initials = userName.slice(0,2).toUpperCase();

  msgs.forEach(m => {
    const row = document.createElement('div');
    if (m.role === 'user') {
      row.className = 'msg-row user';
      const bubbleClass = isReadonly ? 'bubble readonly-user' : 'bubble user';
      let content = m.text ? `<div class="bubble ${bubbleClass}">${escHtml(m.text)}${m.img ? `<img src="${m.img}" alt="image">` : ''}<div class="bubble-time">${m.time}</div></div>` : `<div class="bubble ${bubbleClass}"><img src="${m.img}" alt="image"><div class="bubble-time">${m.time}</div></div>`;
      const avStyle = isReadonly ? 'background:rgba(249,115,22,0.15);color:#f97316;border:1px solid rgba(249,115,22,0.3)' : 'background:linear-gradient(135deg,var(--accent),var(--accent2));color:white';
      row.innerHTML = `${content}<div class="msg-av" style="${avStyle}">${initials}</div>`;
    } else {
      row.className = 'msg-row ai';
      row.innerHTML = `<div class="msg-av" style="background:var(--bg3);border:1px solid var(--border2);font-size:16px">✦</div><div class="bubble ai">${escHtml(m.text)}<div class="bubble-time">${m.time}</div></div>`;
    }
    el.appendChild(row);
  });
  el.scrollTop = el.scrollHeight;
}

function escHtml(t) { return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>'); }

function now() { const d = new Date(); return d.getHours()+':'+(d.getMinutes()<10?'0':'')+d.getMinutes(); }

function currentKey() { return isAdmin ? '__admin__' : currentUser; }

async function sendMsg() {
  if (currentReadonly) return;
  const inp = document.getElementById('msgInput');
  const text = inp.value.trim();
  if (!text) return;
  inp.value = ''; inp.style.height = '';
  pushMsg({ role:'user', text, time:now() });
  await askAI(text, null);
}

async function sendImage(input) {
  if (!input.files[0] || currentReadonly) return;
  const reader = new FileReader();
  reader.onload = async (e) => {
    const src = e.target.result;
    pushMsg({ role:'user', img:src, text:'', time:now() });
    await askAI('J\'ai envoyé une image.', src);
    input.value = '';
  };
  reader.readAsDataURL(input.files[0]);
}

function pushMsg(msg) {
  const key = currentKey();
  allConvs[key].push(msg);
  saveAll();
  renderMessages(allConvs[key]);
}

function showTyping() {
  const el = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'msg-row ai'; div.id = 'typing';
  div.innerHTML = `<div class="msg-av" style="background:var(--bg3);border:1px solid var(--border2);font-size:16px">✦</div><div class="typing"><span></span><span></span><span></span></div>`;
  el.appendChild(div);
  el.scrollTop = el.scrollHeight;
}

function removeTyping() { const t = document.getElementById('typing'); if(t) t.remove(); }

async function askAI(userText, imgData) {
  const key = currentKey();
  const history = allConvs[key]
    .filter(m => m.role === 'user' || m.role === 'ai');

  // Build Gemini contents
  const contents = [];
  // System message as first user turn
  contents.push({ role:'user', parts:[{ text: SYSTEM_PROMPT }] });
  contents.push({ role:'model', parts:[{ text: "Compris, je suis prêt !" }] });

  history.forEach(m => {
    if (m.role === 'ai') {
      contents.push({ role:'model', parts:[{ text: m.text }] });
    } else {
      const parts = [];
      if (m.img && m.img.startsWith('data:image')) {
        const b64 = m.img.split(',')[1];
        const mime = m.img.split(';')[0].split(':')[1];
        parts.push({ inlineData: { mimeType: mime, data: b64 } });
      }
      parts.push({ text: m.text || 'Voici une image.' });
      contents.push({ role:'user', parts });
    }
  });

  showTyping();
  try {
    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-lite:generateContent?key=${GEMINI_KEY}`, {
      method:'POST',
      headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({ contents })
    });
    if (!res.ok) {
      const err = await res.json();
      throw new Error(JSON.stringify(err));
    }
    const data = await res.json();
    const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || "Désolé, je n'ai pas pu répondre.";
    removeTyping();
    pushMsg({ role:'ai', text:reply, time:now() });
  } catch(e) {
    removeTyping();
    pushMsg({ role:'ai', text:"Erreur: " + e.message, time:now() });
  }
}

function handleKey(e) { if (e.key==='Enter' && !e.shiftKey) { e.preventDefault(); sendMsg(); } }
function autoResize(el) { el.style.height=''; el.style.height=Math.min(el.scrollHeight,120)+'px'; }
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// Auto-focus
document.getElementById('nameInput').addEventListener('keydown', e => { if(e.key==='Enter') login(); });
</script>
</body>
</html>
